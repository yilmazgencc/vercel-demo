<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog · Vercel Demo</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><main>
  <h1>Blog</h1><p class="lead">Yazılar <code>/api/posts</code> uç noktasından çekilir.</p>
  <div class="row"><input id="q" type="search" placeholder="Ara…" aria-label="Ara"><select id="tag" style="width:auto"><option value="">Tüm etiketler</option></select></div>
  <p class="muted" id="count" style="margin:.8rem 0"></p>
  <div class="grid" id="list"></div>

  <h2>📖 Ziyaretçi defteri</h2>
  <form class="card" id="gbForm">
    <div class="row"><input id="gbName" placeholder="Adınız (isteğe bağlı)" maxlength="40" aria-label="Ad"></div>
    <div class="row" style="margin-top:.6rem"><input id="gbMsg" placeholder="Bir mesaj bırakın…" maxlength="280" required aria-label="Mesaj"><button>Gönder</button></div>
    <p class="muted" id="gbInfo" style="margin-top:.5rem"></p>
  </form>
  <div id="gbList" style="margin-top:1rem"></div>
</main><footer>Vercel ile yayınlandı</footer>
<script type="module">
import { api, esc } from '/assets/app.js';
let t;
async function load() {
  const p = new URLSearchParams({ q: q.value.trim(), tag: tag.value });
  for (const [k, v] of [...p]) if (!v) p.delete(k);
  try {
    const { data } = await api('/api/posts?' + p);
    if (tag.options.length === 1) data.tags.forEach((x) => tag.add(new Option(x, x)));
    count.textContent = `${data.count} yazı`;
    list.innerHTML = data.posts.map((x) => `<article class="card"><span class="tag">${esc(x.tag)}</span><span class="muted">${x.minutes} dk</span>
      <h3 style="margin-top:.4rem">${esc(x.title)}</h3><p class="muted">${esc(x.summary)}</p></article>`).join('') || '<p class="muted">Sonuç yok.</p>';
  } catch { count.textContent = 'Yazılar yüklenemedi.'; }
}
q.oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
tag.onchange = load; load();

const adminKey = localStorage.getItem('adminKey');
gbList.onclick = async (e) => {
  const id = e.target.dataset.del; if (!id || !confirm('Bu mesaj silinsin mi?')) return;
  const r = await fetch('/api/guestbook?id=' + encodeURIComponent(id), { method: 'DELETE', headers: { 'x-admin-key': adminKey } });
  if (r.ok) loadGb(); else alert('Silinemedi: ' + ((await r.json().catch(() => ({}))).error || r.status));
};
async function loadGb() {
  try {
    const r = await fetch('/api/guestbook'); if (!r.ok) throw new Error();
    const items = await r.json();
    gbList.innerHTML = items.map((m) => `<div class="card" style="margin-bottom:.6rem"><b>${esc(m.name)}</b>
      <span class="muted"> · ${new Date(m.createdAt).toLocaleString('tr-TR')}</span>${adminKey ? ` <button class="ghost" data-del="${esc(m.id)}" aria-label="Sil">✕</button>` : ''}<p>${esc(m.message)}</p></div>`).join('') || '<p class="muted">Henüz mesaj yok.</p>';
  } catch { gbList.innerHTML = '<p class="muted">Ziyaretçi defteri yüklenemedi.</p>'; }
}
gbForm.onsubmit = async (e) => {
  e.preventDefault(); gbInfo.textContent = 'Gönderiliyor…';
  const r = await fetch('/api/guestbook', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: gbName.value, message: gbMsg.value }) });
  if (r.ok) { gbMsg.value = ''; gbInfo.textContent = 'Teşekkürler!'; loadGb(); }
  else gbInfo.textContent = 'Hata: ' + ((await r.json().catch(() => ({}))).error || r.status);
};
loadGb();
</script></body></html>
